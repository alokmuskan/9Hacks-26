; Type checking configuration for the backend Python code.
;
; Run with:  mypy            (uses this file)
;
; Scope is deliberately staged rather than "everything or nothing":
;
;   common.py, object_detection.py, scene_memory.py, server.py,
;   detection_bench.py                                          -> enforced, currently clean
;   main.py                                                     -> known debt, see below
;   tests/                                                      -> not checked
;
; main.py reports ~108 findings today, 104 of them `union-attr` ("item None of
; ... | None has no attribute ...") in the long CLI/report/chat helpers. Fixing
; those means adding real None-guards through large functions, which is a
; refactor rather than a lint task, so it is switched off *explicitly* instead of
; leaving the file silently unchecked. Removing the override below is the whole
; change needed to start enforcing it.

[mypy]
python_version = 3.11

files = common.py, object_detection.py, scene_memory.py, server.py, detection_bench.py, main.py

; insightface, cv2, faiss, torch, open_clip and l2cs ship no usable type stubs.
ignore_missing_imports = True

; Do not read stubs from site-packages. Two reasons: numpy's current stubs use 3.12
; syntax (`type` statements) that cannot be parsed under the pinned
; python_version = 3.11, and it makes results identical whether or not the heavy
; runtime dependencies happen to be installed locally.
no_site_packages = True

; Keep the checks that catch real mistakes in code that is already clean.
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
show_error_codes = True
show_column_numbers = True

exclude = (^|/)(\.venv|\.venv-tools|\.pixi|frontend|runs|build|dist)(/|$)

[mypy-main]
; See the header: main.py has ~104 possible-None dereferences still to be guarded.
ignore_errors = True


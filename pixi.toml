[workspace]
authors = ["Alok Raj <alokraj1319@gmail.com>"]
channels = ["conda-forge"]
name = "9hacks26"
platforms = ["linux-64"]
version = "0.1.0"

# The camera index is intentionally NOT hardcoded here: set AI_STUDIO_CAM_CAMERA_INDEX
# in your shell or .env instead. Hardcoding it made these tasks unable to target a
# real webcam. See docs/ and the README for the v4l2loopback virtual-camera setup.
[tasks]
run = "python main.py recognize"
enroll = "python main.py enroll"
recognize = "python main.py recognize"
list = "python main.py list"
report = "python main.py report"
doctor = "python main.py doctor"
bootstrap = "python main.py bootstrap"

[dependencies]
python = "3.11.*"
insightface = ">=0.7.3,<0.8"
opencv = ">=4.10,<5"
ultralytics = ">=8.4.0,<9"
pytorch = ">=2.5,<3"
torchvision = ">=0.20,<1"
pillow = ">=11,<12"
numpy = ">=1.26,<3"
faiss-cpu = ">=1.9,<2"
open-clip-torch = ">=3.0,<4"
huggingface_hub = ">=1.7.1,<2"
pytest = ">=9.0.2,<10"

[pypi-dependencies]
gdown = "*"
l2cs = { git = "https://github.com/Ahmednull/L2CS-Net.git", rev = "a4d8f7fa5436a2b2b9f088471623b552a85811bd" }
face_detection = { git = "https://github.com/elliottzheng/face-detection.git" }
groq = "*"
python-dotenv = ">=1,<2"
fastapi = "*"
uvicorn = "*"
httpx = "*"
websockets = "*"
